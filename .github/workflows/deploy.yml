name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build frontend
        run: npm install && npm run build

      - name: Generate config.php dari secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir -p api/src
          cat > api/src/config.php << PHPEOF
          <?php
          return [
              'db' => [
                  'host'    => '${DB_HOST}',
                  'port'    => '3306',
                  'name'    => '${DB_NAME}',
                  'user'    => '${DB_USER}',
                  'pass'    => '${DB_PASS}',
                  'charset' => 'utf8mb4',
              ],
              'cors' => ['allowed_origin' => '*'],
              'cache' => ['enabled' => true, 'dir' => __DIR__ . '/../cache', 'ttl' => 300],
          ];
          PHPEOF

      - name: Deploy frontend (dist/) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Deploy API & config via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/dist/**
            .env*
            .gitignore
            README.md
            package*.json
            vite.config.js
            isr-spectrum.code-workspace
            index.html
