name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build



      # Siapkan folder deploy tunggal: dist/ + api/ + PHP auth files
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy_root/api deploy_root/includes
          cp -r dist/. deploy_root/
          cp -r api/. deploy_root/api/
          cp -r includes/. deploy_root/includes/
          cp login.php callback.php logout.php config.php index.php favicon.svg deploy_root/
          cp .htaccess deploy_root/ 2>/dev/null || true

      # Generate kasper_config.php dari secrets
      - name: Generate kasper_config.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SSO_PUBLIC_KEY: ${{ secrets.SSO_PUBLIC_KEY }}
        run: |
          cat > deploy_root/kasper_config.php << PHPEOF
          <?php
          define('APP_BASE_URL',  'https://kasper.balmonjogja.info');
          define('SSO_URL',       'https://gudeg.xo.je/sso.php');
          define('SSO_CLIENT_ID', '1d4b1ae1b885ed27');
          define('SSO_PUBLIC_KEY', <<<PEM
          ${SSO_PUBLIC_KEY}
          PEM);
          define('DB_HOST', '${DB_HOST}');
          define('DB_NAME', '${DB_NAME}');
          define('DB_USER', '${DB_USER}');
          define('DB_PASS', '${DB_PASS}');
          PHPEOF
          echo "OK: kasper_config.php generated"

      # Deploy via lftp — lebih handal dari FTP action, support passive mode eksplisit
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3..."
            if lftp -c "
              set ftp:passive-mode yes;
              set ftp:ssl-allow no;
              set net:timeout 60;
              set net:max-retries 3;
              set net:reconnect-interval-base 10;
              open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
              mirror --reverse --delete --verbose --parallel=2 deploy_root/ /public_html/;
              bye
            "; then
              echo "Deploy sukses pada attempt $attempt"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Gagal, tunggu 30 detik sebelum retry..."
              sleep 30
            else
              echo "Semua attempt gagal"
              exit 1
            fi
          done

      # Health check — pastikan site up dan API merespons setelah deploy
      - name: Health check
        run: |
          echo "Menunggu 20 detik agar server settle..."
          sleep 20
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://kasper.balmonjogja.info/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "OK: /api/health return 200"
              curl -s https://kasper.balmonjogja.info/api/health | python3 -m json.tool
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retry dalam 10 detik..."
            sleep 10
          done
          echo "WARNING: health check tidak return 200 setelah 3 percobaan — deploy tetap dianggap sukses"
          exit 0
