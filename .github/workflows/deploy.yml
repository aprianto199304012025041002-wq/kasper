name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build frontend
        run: npm install && npm run build

      - name: Generate config.php dari secrets
        run: |
          cat > api/src/config.php << PHPEOF
          <?php
          return [
              'db' => [
                  'host'    => '${{ secrets.DB_HOST }}',
                  'port'    => '3306',
                  'name'    => '${{ secrets.DB_NAME }}',
                  'user'    => '${{ secrets.DB_USER }}',
                  'pass'    => '${{ secrets.DB_PASS }}',
                  'charset' => 'utf8mb4',
              ],
              'cors' => [
                  'allowed_origin' => '*',
              ],
              'cache' => [
                  'enabled' => true,
                  'dir'     => __DIR__ . '/../cache',
                  'ttl'     => 300,
              ],
          ];
          PHPEOF

      - name: Deploy via FTP ke Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/api/cache/**
            package*.json
            vite.config.js
            README.md
            .env*
            isr-spectrum.code-workspace
