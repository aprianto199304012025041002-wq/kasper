name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build frontend
        run: npm ci && npm run build

      - name: Inject DB credentials ke data.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          sed -i "s|DB_HOST_PLACEHOLDER|$DB_HOST|g" api/data.php
          sed -i "s|DB_NAME_PLACEHOLDER|$DB_NAME|g" api/data.php
          sed -i "s|DB_USER_PLACEHOLDER|$DB_USER|g" api/data.php
          sed -i "s|DB_PASS_PLACEHOLDER|$DB_PASS|g" api/data.php
          echo "OK: credentials injected"

      - name: Deploy frontend (dist/) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: true

      - name: Deploy API via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./api/
          server-dir: /public_html/api/
