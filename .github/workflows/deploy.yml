name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Inject credentials SETELAH build — agar data.php berisi credential
      # tidak pernah ada di direktori yang di-build Vite (api/ tidak di-build)
      # dan tidak ada risiko build gagal + file dengan credential ter-cache.
      - name: Inject DB credentials ke data.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          sed -i "s|DB_HOST_PLACEHOLDER|$DB_HOST|g" api/data.php
          sed -i "s|DB_NAME_PLACEHOLDER|$DB_NAME|g" api/data.php
          sed -i "s|DB_USER_PLACEHOLDER|$DB_USER|g" api/data.php
          sed -i "s|DB_PASS_PLACEHOLDER|$DB_PASS|g" api/data.php
          # Verifikasi: placeholder tidak boleh ada lagi
          grep -q 'PLACEHOLDER' api/data.php && echo "ERROR: placeholder masih ada!" && exit 1 || echo "OK: credentials injected"

      # Siapkan folder deploy tunggal: dist/ + api/ digabung
      # Menghindari dua koneksi FTP berurutan yang bisa kena throttle Hostinger
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy_root/api
          cp -r dist/. deploy_root/
          cp -r api/. deploy_root/api/

      # Deploy sekali — satu koneksi FTP untuk semua file
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./deploy_root/
          server-dir: /public_html/
          protocol: ftps
          timeout: 120000
          retry-count: 5

      # Health check — pastikan site up dan API merespons setelah deploy
      - name: Health check
        run: |
          echo "Menunggu 10 detik agar server settle..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://kasper.balmonjogja.info/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "GAGAL: health check return HTTP $STATUS"
            exit 1
          fi
          echo "OK: /api/health return 200"
          curl -s https://kasper.balmonjogja.info/api/health | python3 -m json.tool
