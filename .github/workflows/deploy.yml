name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build frontend
        run: npm install && npm run build

      - name: Generate config.php dari secrets
        run: |
          mkdir -p /tmp/config_only
          cat > /tmp/config_template.php << 'PHPEOF'
<?php
return [
    'db' => [
        'host'    => '__DB_HOST__',
        'port'    => '3306',
        'name'    => '__DB_NAME__',
        'user'    => '__DB_USER__',
        'pass'    => '__DB_PASS__',
        'charset' => 'utf8mb4',
    ],
    'cors'  => ['allowed_origin' => '*'],
    'cache' => ['enabled' => true, 'dir' => __DIR__ . '/../cache', 'ttl' => 300],
];
PHPEOF
          sed \
            -e "s|__DB_HOST__|${DB_HOST}|g" \
            -e "s|__DB_NAME__|${DB_NAME}|g" \
            -e "s|__DB_USER__|${DB_USER}|g" \
            -e "s|__DB_PASS__|${DB_PASS}|g" \
            /tmp/config_template.php > /tmp/config_only/config.php
          echo "=== config.php baris pertama ===" && head -1 /tmp/config_only/config.php | cat -A
          echo "=== placeholder check ===" && (grep '__DB_' /tmp/config_only/config.php && echo "ERROR: placeholder belum terganti!" && exit 1) || echo "OK"
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}

      # Urutan deploy KRITIS:
      # 1) dist/ dengan clean-slate → hapus semua file lama di public_html/
      # 2) api/ tanpa clean-slate  → tambah folder api/ ke public_html/ (dist/ tetap ada)
      # 3) config.php dari /tmp    → override placeholder yang ada di repo

      - name: Deploy frontend (dist/) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: true

      - name: Deploy API via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./api/
          server-dir: /public_html/api/
          exclude: |
            **/src/config.php

      - name: Upload config.php (generated dari secrets, bukan dari repo)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: /tmp/config_only/
          server-dir: /public_html/api/src/
