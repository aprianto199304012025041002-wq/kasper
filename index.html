<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Visualisasi spektrum frekuensi FM berbasis data ISR Balmon Jogja. Overlay allotment KM Komdigi No. 570 Tahun 2025."/>
  <meta name="theme-color" content="#03070D"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="robots" content="noindex, nofollow"/>

  <title>KASPER — Kanal Spektrum Radio</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2303070D'/><text x='16' y='23' text-anchor='middle' font-size='20'>📻</text></svg>"/>

  <!-- DNS prefetch untuk Google Fonts -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com"/>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <!-- JetBrains Mono + Inter — sesuai CSS variables --mono dan --sans -->
  <!-- media=print + onload: non-blocking font load, fallback via <noscript> -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  </noscript>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
